# KataGo analysis 模式配置（PC2: RTX 3060 6GB / 32GB / Ryzen 9 5900HX）
# 文档: https://github.com/lightvector/KataGo/blob/master/docs/Analysis_Engine.md

# ---------- 日志 ----------
logDir = gtp_logs
logAllGTPCommunication = false
logSearchInfo = false
logToStdout = false
logTimestamps = true

# ---------- 后端 ----------
# CUDA（NVIDIA GPU）。若无 GPU 改用 "eigen" CPU 后端。
backend = cuda
backendGpuToUse = 0

# 显存控制：RTX 3060 6GB。maxVisits 受此约束，单局 500 以内安全。
# 若 OOM，调低 nnMaxBatchSize 或 nnavxThreads。
nnMaxBatchSize = 64
nnMaxPollIters = 4
nnCacheSizeHistory = 250000

# ---------- 线程 ----------
# numSearchThreads 建议 = CPU 物理核心数的一半，4 适合本机并发分析。
numSearchThreads = 4

# ---------- 棋盘与规则 ----------
# 报告胜率格式：SCORE = 同时输出目数差 scoreLead
reportAnalysisWinratesAs = SCORE

# 动态分析每步的 visits 上限由查询的 maxVisits 字段控制，这里设全局上限保护。
maxVisits = 800

# 默认 komi/规则可在查询中覆盖
rules = chinese
analyzeCommandKWArgs = true

# ---------- 性能 ----------
# 启用各种优化
useSearchTree = true
numSearchThreadsBatch = 8

# 避免显存碎片
gpuCacheSize = 200000000
