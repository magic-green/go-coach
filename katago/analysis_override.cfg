# ============================================================
# 围棋 AI 教练 - KataGo Analysis 配置（CPU Eigen 版）
# 基于官方 analysis_example.cfg 裁剪，包含 analysis 模式运行所需的全部必选键。
# 后端：Eigen CPU（无需 CUDA/TensorRT，开箱即用）
# 控制端：RT Ai 4线程，搜索保守，响应略慢但稳定，适合单机教学/工具站。
# ============================================================

# ---------- 日志 ----------
logDir = analysis_logs
logSearchInfo = false
logToStdout = false
logErrorsAndWarnings = true
# 屏蔽查询字段拼写警告（封装层使用 overrideSettings）
warnUnusedFields = false

# ---------- 分析输出 ----------
# 关键：winrates/scoreLead 一律按 BLACK 视角报告（与代码中的视角转换逻辑一致）。
reportAnalysisWinratesAs = BLACK
reportAnalysisPvOrder = true
reportAnalysisMoves = 8
analysisPVLen = 12
analyzeCommandKWArgs = true

# ---------- 规则/贴目 ----------
rules = chinese
komi = 7.5

# ---------- 搜索上限（API 请求也会传 maxVisits，这里是全局天花板）----------
maxVisits = 800

# ---------- 后端 & 线程（CUDA GPU 版调优）----------
backend = cuda
cpuNumNNThreads = 2

# 分析线程配置：
#  numAnalysisThreads：并行处理多少个"局面查询"。
#     单机教学同时只有 1 个用户落子，设为 1 把所有核都给当前搜索。
#  numSearchThreadsPerAnalysisThread：单个搜索用多少线程。
#     CPU 4 核设为 4，若 CPU 核更多可上调。
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 4

# NN 批大小：CPU 不需要太大 batch，保守设 16。
nnMaxBatchSize = 16

# ---------- 其他搜索性能 ----------
useSearchTree = true
wideRootNoise = 0.02
